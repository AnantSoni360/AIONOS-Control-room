<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIONOS — Sign In</title>
  <meta name="description" content="Sign in to AIONOS Operations Control Room" />
  <link rel="stylesheet" href="src/css/design.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text y='.9em' font-size='70' x='12'>A</text></svg>" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 60% at 20% 30%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(139,92,246,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 10%, rgba(59,130,246,0.07) 0%, transparent 60%);
    }

    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 16px;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(99,102,241,0.1);
    }

    .login-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 36px; justify-content: center;
    }
    .login-logo-mark {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 900; color: white;
      box-shadow: 0 0 24px rgba(99,102,241,0.4);
    }
    .login-logo-text {
      font-size: 1.4rem; font-weight: 800; letter-spacing: -0.03em;
    }
    .login-logo-text span {
      display: block; font-size: 0.7rem; font-weight: 500;
      color: var(--text-secondary); letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px;
    }

    .login-title {
      text-align: center; margin-bottom: 8px;
      font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .login-subtitle {
      text-align: center; margin-bottom: 32px;
      font-size: 0.82rem; color: var(--text-secondary); line-height: 1.5;
    }

    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 6px;
    }

    .login-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white; border: none; border-radius: var(--radius-sm);
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; letter-spacing: 0.02em;
      margin-top: 8px;
      box-shadow: 0 4px 16px rgba(99,102,241,0.4);
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.5);
    }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-error {
      background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3);
      border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 0.82rem; color: #f43f5e; margin-bottom: 16px;
      display: none;
    }
    .login-error.show { display: block; }

    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 0.72rem; color: var(--text-muted);
    }

    .spinner-inline {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-mark">A</div>
        <div class="login-logo-text">AIONOS <span>Operations Control Room</span></div>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to monitor your AI agents and manage operational alerts across all departments.</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email"
            placeholder="you@company.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="login-btn" type="submit" id="login-btn">Sign In</button>
      </form>

      <div class="login-footer">
        AIONOS v5.0 &nbsp;·&nbsp; Secured by Supabase Auth
      </div>
    </div>
  </div>

  <script>
    const BASE = "http://localhost:8000";

    // If already logged in, redirect to dashboard
    const token = localStorage.getItem("aionos_token");
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        if (payload.exp * 1000 > Date.now()) {
          window.location.href = "/ui/";
        }
      } catch (_) {}
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn   = document.getElementById("login-btn");
      const error = document.getElementById("login-error");
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>Signing in…';
      error.classList.remove("show");

      try {
        const res = await fetch(`${BASE}/api/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Login failed");
        }

        localStorage.setItem("aionos_token",         data.access_token);
        localStorage.setItem("aionos_refresh_token",  data.refresh_token);
        localStorage.setItem("aionos_user",           JSON.stringify(data.user));

        window.location.href = "/ui/";
      } catch (err) {
        error.textContent = err.message || "Invalid credentials. Please try again.";
        error.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
