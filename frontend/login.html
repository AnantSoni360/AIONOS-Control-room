<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIONOS — Sign In</title>
  <meta name="description" content="Sign in to AIONOS Operations Control Room" />
  <link rel="stylesheet" href="src/css/design.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ea580c'/><text y='.9em' font-size='70' x='12'>A</text></svg>" />
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f8fafc; }

    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 15% 50%, rgba(249, 115, 22, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(234, 88, 12, 0.06), transparent 25%);
    }

    .login-wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      padding: 16px;
    }

    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.05), 0 0 0 1px rgba(234,88,12,0.05);
    }

    .login-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px; justify-content: center;
    }
    .login-logo-mark {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900; color: white;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.3);
    }
    .login-logo-text { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: #0f172a; }
    .login-logo-text span {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: #ea580c; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 2px;
    }

    .login-title {
      text-align: center; margin-bottom: 8px;
      font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; color: #0f172a;
    }
    .login-subtitle {
      text-align: center; margin-bottom: 32px;
      font-size: 0.85rem; color: #64748b; line-height: 1.5;
    }

    .test-credentials {
      background: #ffedd5; border: 1px dashed #fdba74;
      border-radius: var(--radius-md); padding: 12px 16px;
      margin-bottom: 24px; font-size: 0.8rem; color: #9a3412;
      display: flex; flex-direction: column; gap: 4px;
    }
    .test-credentials strong { color: #7c2d12; }

    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block; font-size: 0.75rem; font-weight: 700;
      color: #475569; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 8px;
    }

    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white; border: none; border-radius: var(--radius-md);
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: all 0.2s; letter-spacing: 0.02em;
      margin-top: 8px;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.3);
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(234, 88, 12, 0.4);
    }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

    .login-error {
      background: #fee2e2; border: 1px solid #fca5a5;
      border-radius: var(--radius-sm); padding: 12px 16px;
      font-size: 0.85rem; color: #b91c1c; margin-bottom: 20px;
      display: none; font-weight: 500;
    }
    .login-error.show { display: block; }

    .login-footer {
      text-align: center; margin-top: 32px;
      font-size: 0.75rem; color: #94a3b8; font-weight: 500;
    }

    .spinner-inline {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-mark">A</div>
        <div class="login-logo-text">AIONOS <span>Operations Control Room</span></div>
      </div>

      <h1 class="login-title">Welcome back</h1>
      <p class="login-subtitle">Sign in to monitor your AI agents and manage operational alerts across all departments.</p>

      <!-- TEST CREDENTIALS BOX -->
      <div class="test-credentials">
        <div style="font-weight:700;margin-bottom:2px;text-transform:uppercase;font-size:0.7rem;letter-spacing:0.05em">Evaluation Credentials</div>
        <div><strong>Email:</strong> anantsoni360@gmail.com</div>
        <div><strong>Password:</strong> Anantsoni2005</div>
      </div>

      <div class="login-error" id="login-error"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="input" type="email" id="email" name="email"
            placeholder="anantsoni360@gmail.com" value="anantsoni360@gmail.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="input" type="password" id="password" name="password"
            placeholder="••••••••" value="Anantsoni2005" autocomplete="current-password" required />
        </div>
        <button class="login-btn" type="submit" id="login-btn">Sign In to Dashboard</button>
      </form>

      <div class="login-footer">
        AIONOS v5.0 &nbsp;·&nbsp; Secured by Supabase Auth
      </div>
    </div>
  </div>

  <script src="src/js/config.js"></script>
  <script>
    const BASE = window.AIONOS_API_URL || "https://aionos-agentic-factory-production.up.railway.app";

    // If already logged in, redirect to dashboard
    const token = localStorage.getItem("aionos_token");
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        if (payload.exp * 1000 > Date.now()) {
          const basePath = window.location.pathname.startsWith('/ui') ? '/ui' : '';
          window.location.href = `${basePath}/`;
        }
      } catch (_) {}
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn   = document.getElementById("login-btn");
      const error = document.getElementById("login-error");
      const email    = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>Signing in…';
      error.classList.remove("show");

      try {
        const res = await fetch(`${BASE}/api/auth/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Login failed");
        }

        localStorage.setItem("aionos_token",         data.access_token);
        localStorage.setItem("aionos_refresh_token",  data.refresh_token);
        localStorage.setItem("aionos_user",           JSON.stringify(data.user));

        const basePath = window.location.pathname.startsWith('/ui') ? '/ui' : '';
        window.location.href = `${basePath}/`;
      } catch (err) {
        error.textContent = err.message || "Invalid credentials. Please try again.";
        error.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
