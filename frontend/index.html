<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIONOS — Operations Control Room</title>
  <meta name="description" content="AIONOS Agentic AI Factory — real-time multi-department operations control room. Monitor alerts, trigger AI agents, and manage human approvals." />

  <!-- Design System -->
  <link rel="stylesheet" href="src/css/design.css" />

  <!-- Favicon inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text y='.9em' font-size='70' x='12'>A</text></svg>" />

  <style>
    /* ── App-level overrides ── */
    #app { min-height: 100vh; }

    /* Gradient mesh background */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 60% 40% at 10% 20%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 90% 80%, rgba(139,92,246,0.06) 0%, transparent 60%);
    }
    #app { position: relative; z-index: 1; }

    /* Status indicator in header area */
    .status-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: var(--text-secondary);
      padding: 4px 10px; border-radius: 100px;
      background: var(--bg-glass); border: 1px solid var(--border);
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--resolved);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Loading skeleton shown before JS boots -->
    <div class="app-layout">
      <div style="width:220px;background:var(--bg-surface);border-right:1px solid var(--border);min-height:100vh"></div>
      <div class="main" style="display:flex;align-items:center;justify-content:center">
        <div style="text-align:center">
          <div class="spinner spinner-lg" style="margin:0 auto 16px"></div>
          <div style="color:var(--text-secondary);font-size:0.9rem">Loading AIONOS Control Room…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
